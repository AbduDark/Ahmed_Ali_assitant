# Development overrides — hot reload, no nginx, exposed ports
services:
  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    ports:
      - "5432:5432"

  # ── Redis ─────────────────────────────────────────────────
  redis:
    ports:
      - "6379:6379"

  # ── Backend (dev mode with hot reload) ────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - APP_DEBUG=true

  # ── Worker (dev mode) ─────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    command: arq app.workers.settings.WorkerSettings

  # ── Frontend (Vite dev server) ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000

  # ── Disable nginx in development ─────────────────────────
  nginx:
    profiles:
      - production
