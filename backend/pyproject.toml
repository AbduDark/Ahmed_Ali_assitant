[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teacher-ai-assistant"
version = "1.0.0"
description = "AI Educational Assistant for History and Geography Teachers"
requires-python = ">=3.12"
dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",

    # --- Validation & Settings ---
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",

    # --- Authentication ---
    "passlib[argon2]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",

    # --- Redis ---
    "redis[hiredis]>=5.0.0",

    # --- Background Jobs ---
    "arq>=0.26.0",

    # --- Telegram ---
    "python-telegram-bot>=21.0",

    # --- AI Providers ---
    "google-generativeai>=0.8.0",
    "groq>=0.9.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",

    # --- Document Processing ---
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "beautifulsoup4>=4.12.0",

    # --- Text Processing ---
    "tiktoken>=0.7.0",

    # --- Utilities ---
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
