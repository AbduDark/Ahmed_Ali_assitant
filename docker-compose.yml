services:
  # ── PostgreSQL with pgvector ──────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: teacher_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: teacher_ai_db
      POSTGRES_USER: teacher_ai
      POSTGRES_PASSWORD: teacher_ai_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teacher_ai -d teacher_ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: teacher_ai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teacher_ai_backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Background Worker (ARQ) ──────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teacher_ai_worker
    restart: unless-stopped
    env_file:
      - .env
    command: arq app.workers.settings.WorkerSettings
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend (Nginx serves built React app) ──────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teacher_ai_frontend
    restart: unless-stopped

  # ── Nginx (Reverse Proxy with Automated SSL) ──────────────
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: teacher_ai_nginx
    restart: unless-stopped
    environment:
      DOMAIN_NAME: 192.99.144.235.nip.io
      SSL_EMAIL: admin@192.99.144.235.nip.io
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  certbot_conf:
  certbot_www:
